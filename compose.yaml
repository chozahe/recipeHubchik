services:
  app:
    image: ${RECIPEHUB_IMAGE:-recipehub-app:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URL: "postgresql://recipehub:recipehub_password@postgres:5432/recipehub?serverVersion=16&charset=utf8"
      LOG_DIR: /var/log/recipehub
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - recipehub_logs:/var/log/recipehub

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recipehub
      POSTGRES_USER: recipehub
      POSTGRES_PASSWORD: recipehub_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipehub -d recipehub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

volumes:
  postgres_data:
  recipehub_logs:
  loki_data:
