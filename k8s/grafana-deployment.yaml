apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: trofimov20260527
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: recipehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: recipehub
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/loki.yaml
              subPath: loki.yaml
              readOnly: true
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
